<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <filter id="shadow-connect" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <style>
      .terminal-title { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #8b949e; }
      .code-font { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .label { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; fill: #38bdf8; font-weight: 600; }
      .value { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; fill: #e6edf3; }
      .tag { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #484f58; }
    </style>
  </defs>

  <!-- Floating Terminal Window -->
  <g filter="url(#shadow-connect)">
    <!-- Window Background -->
    <rect x="20" y="20" width="760" height="280" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    
    <!-- Title Bar -->
    <path d="M 20 30 A 10 10 0 0 1 30 20 L 770 20 A 10 10 0 0 1 780 30 L 780 56 L 20 56 Z" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <line x1="20" y1="56" x2="780" y2="56" stroke="#30363d" stroke-width="1"/>
    
    <!-- Window Control Buttons (Traffic Lights) -->
    <circle cx="44" cy="38" r="6" fill="#ff5f56"/>
    <circle cx="64" cy="38" r="6" fill="#ffbd2e"/>
    <circle cx="84" cy="38" r="6" fill="#27c93f"/>

    <!-- Title Bar Text -->
    <text x="400" y="42" text-anchor="middle" class="terminal-title">umam07@github: ~$ ./connect.sh</text>

    <!-- Terminal Command -->
    <text x="50" y="94" class="code-font" font-size="14" font-weight="600" fill="#38bdf8">umam07@github :~$ <tspan fill="#e6edf3" font-weight="400">./connect.sh</tspan></text>

    <!-- Contact Info Grid -->
    <g transform="translate(50, 126)">
      <!-- Item 1: GitHub -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="210" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="18" y="26" class="label">GitHub</text>
        <text x="100" y="26" class="value">@Umam07</text>
      </g>

      <!-- Item 2: Focus -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="220" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="18" y="26" class="label">Focus</text>
        <text x="90" y="26" class="value">Frontend &amp; TS</text>
      </g>

      <!-- Item 3: Status -->
      <g transform="translate(490, 0)">
        <rect x="0" y="0" width="210" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <circle cx="24" cy="21" r="4" fill="#39d353"/>
        <text x="40" y="26" class="value">Available to Collab</text>
      </g>

      <!-- Sub text message -->
      <g transform="translate(0, 72)">
        <text x="0" y="20" class="code-font" font-size="13" fill="#8b949e">&gt; Let's build something clean, fast, and delightful together.</text>
      </g>
    </g>

    <!-- Bottom Corner Tag -->
    <text x="750" y="265" text-anchor="end" class="tag">connect.sh</text>
  </g>
</svg>
