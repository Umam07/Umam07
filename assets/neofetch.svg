<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <filter id="shadow-neo" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <style>
      .terminal-title { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #8b949e; }
      .code-font { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .label { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; fill: #38bdf8; font-weight: 600; }
      .value { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; fill: #e6edf3; }
      .divider { stroke: #30363d; stroke-width: 1; }
      .tag { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #484f58; }
    </style>
  </defs>

  <!-- Floating Terminal Window -->
  <g filter="url(#shadow-neo)">
    <!-- Window Background -->
    <rect x="20" y="20" width="760" height="340" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    
    <!-- Title Bar -->
    <path d="M 20 30 A 10 10 0 0 1 30 20 L 770 20 A 10 10 0 0 1 780 30 L 780 56 L 20 56 Z" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <line x1="20" y1="56" x2="780" y2="56" stroke="#30363d" stroke-width="1"/>
    
    <!-- Window Control Buttons (Traffic Lights) -->
    <circle cx="44" cy="38" r="6" fill="#ff5f56"/>
    <circle cx="64" cy="38" r="6" fill="#ffbd2e"/>
    <circle cx="84" cy="38" r="6" fill="#27c93f"/>

    <!-- Title Bar Text -->
    <text x="400" y="42" text-anchor="middle" class="terminal-title">umam07@github: ~$ neofetch</text>

    <!-- LEFT SIDE: ASCII Github Terminal Art Box -->
    <g transform="translate(60, 95)">
      <!-- Outline rounded rectangle for terminal icon -->
      <rect x="0" y="0" width="105" height="100" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
      
      <!-- Top mini terminal window blocks -->
      <rect x="18" y="20" width="14" height="10" rx="2" fill="#38bdf8"/>
      <rect x="36" y="20" width="14" height="10" rx="2" fill="#38bdf8"/>
      
      <!-- Middle dot and github text -->
      <circle cx="20" cy="52" r="2.5" fill="#38bdf8"/>
      <text x="32" y="56" class="code-font" font-size="14" font-weight="600" fill="#38bdf8">github</text>
      
      <!-- Bottom prompt > _ -->
      <text x="18" y="82" class="code-font" font-size="15" font-weight="600" fill="#38bdf8">&gt; _</text>
    </g>

    <!-- RIGHT SIDE: System & Developer Specs -->
    <g transform="translate(230, 95)">
      <!-- User & Host Header -->
      <text x="0" y="16" class="code-font" font-size="16" font-weight="700" fill="#38bdf8">umam07 <tspan fill="#8b949e" font-weight="400">@github</tspan></text>
      
      <!-- Underline divider -->
      <line x1="0" y1="28" x2="360" y2="28" class="divider"/>

      <!-- Specs List -->
      <g transform="translate(0, 52)">
        <!-- Name -->
        <text x="0" y="0" class="label">Name</text>
        <text x="120" y="0" class="value">Muhammad Syafi'ul Umam</text>

        <!-- Role -->
        <text x="0" y="24" class="label">Role</text>
        <text x="120" y="24" class="value">TypeScript &amp; Frontend Developer</text>

        <!-- Stars -->
        <text x="0" y="48" class="label">Stars</text>
        <text x="120" y="48" class="value">3</text>

        <!-- Repos -->
        <text x="0" y="72" class="label">Repos</text>
        <text x="120" y="72" class="value">22</text>

        <!-- Followers -->
        <text x="0" y="96" class="label">Followers</text>
        <text x="120" y="96" class="value">2</text>

        <!-- Top Lang -->
        <text x="0" y="120" class="label">Top Lang</text>
        <text x="120" y="120" class="value">TypeScript</text>

        <!-- Activity -->
        <text x="0" y="144" class="label">Activity</text>
        <text x="120" y="144" class="value">647 contributions</text>
      </g>

      <!-- Palette Color Pills -->
      <g transform="translate(0, 222)">
        <rect x="0" y="0" width="22" height="12" rx="3" fill="#06b6d4"/>
        <rect x="28" y="0" width="22" height="12" rx="3" fill="#38bdf8"/>
        <rect x="56" y="0" width="22" height="12" rx="3" fill="#3b82f6"/>
        <rect x="84" y="0" width="22" height="12" rx="3" fill="#a855f7"/>
        <rect x="112" y="0" width="22" height="12" rx="3" fill="#ec4899"/>
        <rect x="140" y="0" width="22" height="12" rx="3" fill="#10b981"/>
      </g>
    </g>

    <!-- Bottom Corner Tag -->
    <text x="750" y="340" text-anchor="end" class="tag">neofetch</text>
  </g>
</svg>
